[package]
name = "pocketd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
libc = "0.2"
pocket-git = { path = "../pocket-git" }
pocket-image = { path = "../pocket-image" }
pocket-net = { path = "../pocket-net" }
pocket-proto = { path = "../pocket-proto", features = ["rpc"] }
pocket-store = { path = "../pocket-store" }
pocket-vmm = { path = "../pocket-vmm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "io-util", "time", "process", "sync", "macros", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
