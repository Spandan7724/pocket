[package]
name = "pocket-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
pocket-proto = { path = "../pocket-proto", features = ["rpc"] }
thiserror = "2"
tokio = { version = "1.53", features = ["net", "io-util", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["net", "io-util", "time", "rt-multi-thread", "macros"] }
