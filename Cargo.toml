[workspace]
resolver = "3"
members = ["crates/*", "xtask", "tests"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Spandan7724/pocket"
publish = false
rust-version = "1.98"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release-init]
inherits = "release"
opt-level = "s"
panic = "abort"
